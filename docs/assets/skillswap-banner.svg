    <text x="59" y="197" fill="url(#wordmark)" font-size="112" font-weight="800" letter-spacing="-5">SkillSwap</text>
    <text x="64" y="249" fill="#edf1fc" font-size="30" font-weight="500">Teach. Learn. Grow together.</text>
    <g font-size="16" font-weight="600" text-anchor="middle">
