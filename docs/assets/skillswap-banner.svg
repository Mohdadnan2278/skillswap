      <path d="M-68-20C-54-73 30-85 68-28M68-28V-60M68-28H36" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M68 20C54 73-30 85-68 28M-68 28V60M-68 28H-36" fill="none" stroke="#c4a0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
