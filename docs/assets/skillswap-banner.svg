<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title description">
  <title id="title">SkillSwap</title>
  <desc id="description">Teach. Learn. Grow together. A community for sharing skills and exchanging time credits.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1328"/>
      <stop offset="1" stop-color="#18132f"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" x2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1100" height="360" rx="24" fill="url(#background)"/>
  <rect x="0.5" y="0.5" width="1099" height="359" rx="23.5" fill="none" stroke="#35304f"/>
  <ellipse cx="925" cy="155" rx="280" ry="255" fill="url(#glow)"/>
  <path d="M64 37H218" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
